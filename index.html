
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מצא את האפיקומן</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffecb3;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            border: 8px solid #ff9800;
            border-radius: 20px;
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        #controls {
            position: absolute;
            top: 30px;
            left: 30px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        .game-btn {
            padding: 15px 25px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px #999;
            transition: all 0.1s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .game-btn:active {
            box-shadow: 0 2px #666;
            transform: translateY(4px);
        }
        #enlargeBtn {
            background-color: #4caf50;
        }
        #skipBtn {
            background-color: #f44336;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
    </style>
</head>
